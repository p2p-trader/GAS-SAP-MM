<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP&middot;MM &mdash; Inventory Management</title>
<style>
/* ============ ERP-MM Enterprise Theme ============ */
:root{
  --navy:#12294d;
  --navy-dark:#0d1f3c;
  --primary:#0a6ed1;
  --primary-dark:#0859ac;
  --success:#16803c;
  --warning:#b7791f;
  --danger:#c0392b;
  --bg:#f2f4f8;
  --card:#ffffff;
  --text:#1c2733;
  --muted:#6b7a8d;
  --border:#dde3ec;
  --radius:10px;
  --shadow:0 1px 3px rgba(18,41,77,.08),0 4px 14px rgba(18,41,77,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;display:flex;overflow:hidden}

/* ---------- Sidebar ---------- */
#sidebar{width:232px;min-width:232px;background:var(--navy);color:#fff;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
#sidebar .logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
#sidebar .logo .brand{font-size:20px;font-weight:800;letter-spacing:.5px}
#sidebar .logo .brand .dot{color:#5aa9ff}
#sidebar .logo .sub{font-size:11px;color:#9fb3cc;margin-top:4px;letter-spacing:.4px}
#nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:#cdd8e8;cursor:pointer;font-size:13.5px;font-weight:500;border-left:3px solid transparent;transition:background .12s}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.10);border-left-color:#5aa9ff;color:#fff}
#sidebar .foot{padding:14px 20px;font-size:11px;color:#7f93ad;border-top:1px solid rgba(255,255,255,.12)}

/* ---------- Main / topbar ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
#topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;flex:0 0 60px}
#viewTitle{font-size:17px;font-weight:700;color:var(--navy)}
#topbar .spacer{flex:1}
#topbar .company{font-size:13px;font-weight:600;color:var(--text)}
#topbar .user{font-size:12px;color:var(--muted)}
.quick-search-box{background:#f1f5f9;border:1px solid var(--border);border-radius:18px;padding:5px 12px;font-size:12px;color:var(--text);width:210px;outline:none;transition:all .15s}
.quick-search-box:focus{background:#fff;border-color:var(--primary);width:280px;box-shadow:0 0 0 3px rgba(10,110,209,.15)}
@media(max-width:768px){.quick-search-box{display:none}}
.badge-currency{background:#e8f1fd;color:var(--primary);font-weight:700;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid #c9defa}
#content{flex:1;overflow-y:auto;padding:24px;min-height:0}

/* ---------- Cards / KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;cursor:default;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--primary))}
.kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;color:var(--navy);margin-top:6px}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{box-shadow:0 2px 8px rgba(18,41,77,.16)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card h3{font-size:15px;color:var(--navy);margin-bottom:12px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1100px){.panel-grid{grid-template-columns:1fr}}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.filter-bar{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;background:#fff;padding:12px 14px;border-radius:var(--radius);box-shadow:var(--shadow)}
.filter-bar .fld{display:flex;flex-direction:column;gap:4px}
.filter-bar .fld label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s;background:#e8edf3;color:var(--text)}
.btn:hover{background:#d9e0ea}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#116b32}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#a33226}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{background:#9a671a}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-link{background:none;color:var(--primary);padding:4px 6px;font-weight:600}
.btn-link:hover{background:#e8f1fd}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.tbl thead{background:#eef2f7}
table.tbl th{padding:10px 12px;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:#4a5a70;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--border)}
table.tbl td{padding:9px 12px;border-bottom:1px solid #eef1f6;vertical-align:middle}
table.tbl tbody tr:hover{background:#f6f9fd}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl td.num,table.tbl th.num{text-align:right}
table.tbl td.ctr,table.tbl th.ctr{text-align:center}
.empty-state{padding:28px;text-align:center;color:var(--muted);font-size:13.5px}
.row-actions{white-space:nowrap}
.row-actions .btn{margin-right:4px}

/* ---------- Pills ---------- */
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill-ok{background:#e3f4e9;color:var(--success)}
.pill-warn{background:#fdf1dc;color:var(--warning)}
.pill-danger{background:#fbe4e1;color:var(--danger)}
.pill-info{background:#e2eefd;color:var(--primary)}
.pill-gray{background:#e8edf3;color:#5b6b7f}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:2px}
.fld label{font-size:12px;font-weight:600;color:#3c4c61}
.fld label .req{color:var(--danger)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:var(--font);background:#fff;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(10,110,209,.15)}
input[type=checkbox]{width:auto;transform:scale(1.15)}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#3c4c61}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* ---------- Modal ---------- */
#modalOverlay{position:fixed;inset:0;background:rgba(13,31,60,.5);display:none;align-items:flex-start;justify-content:center;z-index:1000;overflow-y:auto;padding:36px 16px}
#modalOverlay.open{display:flex}
#modalBox{background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:640px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;animation:pop .15s ease-out}
#modalBox.wide{width:900px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
#modalHead{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
#modalTitle{font-size:16px;font-weight:700;color:var(--navy);flex:1}
#modalClose{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
#modalClose:hover{color:var(--danger)}
#modalBody{padding:18px 20px;overflow-y:auto}
#modalFoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ---------- Toast ---------- */
#toasts{position:fixed;top:70px;right:18px;z-index:2000;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#fff;border-left:4px solid var(--primary);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.15);padding:12px 16px;font-size:13px;animation:slidein .2s ease-out;display:flex;gap:8px;align-items:flex-start}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast .t-title{font-weight:700;margin-bottom:2px}

/* ---------- Loading ---------- */
#loading{position:fixed;inset:0;background:rgba(255,255,255,.65);z-index:3000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loading.open{display:flex}
.spinner{width:44px;height:44px;border:4px solid #d7e4f7;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .msg{font-size:13px;color:var(--muted);font-weight:600}

.setup-prompt{max-width:560px;margin:60px auto;text-align:center;padding:40px}
.setup-prompt h2{color:var(--navy);margin-bottom:10px}
.setup-prompt p{color:var(--muted);margin-bottom:20px;line-height:1.6}
.status-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.status-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center}
.status-card .n{font-size:22px;font-weight:800;color:var(--navy)}
.status-card .l{font-size:11.5px;color:var(--muted);margin-top:4px}
.danger-zone{border:1px solid #f0c9c4;background:#fdf3f2}
.danger-zone h3{color:var(--danger)}
.muted{color:var(--muted)}
.small{font-size:12px}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.totals-row{background:#eef2f7;font-weight:700}
a{color:var(--primary)}

/* ---------- Environment & Document Slip Styles ---------- */
.badge-env{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:14px;white-space:nowrap;user-select:none}
.badge-env.live{background:#e3f4e9;color:#16803c;border:1px solid #b7e4c7}
.badge-env.preview{background:#e8f1fd;color:#0a6ed1;border:1px solid #c9defa;cursor:pointer}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.online{background:#16803c;box-shadow:0 0 0 2px rgba(22,128,60,.25)}
.status-dot.demo{background:#0a6ed1;box-shadow:0 0 0 2px rgba(10,110,209,.25)}

.doc-slip{background:#fff;border:1px solid var(--border);border-radius:8px;padding:24px;color:#1c2733;box-shadow:var(--shadow)}
.doc-header{display:flex;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:16px;align-items:flex-start}
.doc-brand{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:.3px}
.doc-title{font-size:16px;font-weight:700;color:var(--primary);text-transform:uppercase;text-align:right}
.doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;font-size:12.5px;line-height:1.7}
.doc-sign{display:flex;justify-content:space-between;margin-top:36px;padding-top:12px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--muted);gap:16px}
.doc-sign div{flex:1;max-width:200px;border-top:1px solid #475569;text-align:center;padding-top:6px;color:#1e293b}

#menuToggle{display:none;background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:15px;color:var(--navy)}
#sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(13,31,60,.4);z-index:1400}

@media (max-width:960px){
  #menuToggle{display:inline-flex;align-items:center;justify-content:center}
  #sidebar{position:fixed;left:-240px;z-index:1500;transition:left .22s cubic-bezier(0.16,1,0.3,1);box-shadow:4px 0 24px rgba(13,31,60,.25)}
  #sidebar.open{left:0}
  #sidebarBackdrop.open{display:block}
  #topbar{padding:0 14px}
  #content{padding:14px}
}

@media print{
  #sidebar, #topbar, .row-actions, .toolbar, .filter-bar, .tabs, .btn, #toasts, #loading, #sidebarBackdrop{display:none !important}
  body, #main, #content, #modalOverlay, #modalBox{overflow:visible !important;height:auto !important;width:100% !important;margin:0 !important;padding:0 !important;box-shadow:none !important;border:none !important;background:#fff !important}
  #modalOverlay{position:static !important;background:none !important;display:block !important}
  #modalHead, #modalFoot{display:none !important}
  #modalBody{padding:0 !important}
  .doc-slip{border:1px solid #000 !important;margin:0 !important;padding:16px !important;page-break-inside:avoid}
  .doc-header{border-bottom:2px solid #000 !important}
}
</style>
</head>

<div id="sidebarBackdrop"></div>

<!-- ============ Sidebar ============ -->
<aside id="sidebar">

  <div id="content"></div>

<!-- ============ Modal ============ -->
<div id="modalOverlay">
  <div id="modalBox">
    <div id="modalHead">
      <div id="modalTitle"></div>

</div>

<div id="toasts"></div>
<div id="loading"><div class="spinner"></div><div class="msg">Working&hellip;</div></div>

    pur_listPOs: (f) => {
      const db = getDB();
      const pos = db.pos;
      const groups = {};
      pos.forEach(p => {
        if(!groups[p.PONo]) groups[p.PONo] = [];
        groups[p.PONo].push(p);
      });
      const vendMap = {};
      db.vendors.forEach(v => { vendMap[v.VendorID] = v.Name; });
      const out = Object.keys(groups).map(poNo => {
        const lines = groups[poNo];
        const first = lines[0];
        const total = lines.reduce((acc, l) => acc + (Number(l.Qty) || 0) * (Number(l.NetPrice) || 0), 0);
        const worst = lines.some(l => l.Status === 'Open') ? 'Open' : (lines.some(l => l.Status === 'Partial') ? 'Partial' : 'Received');
        return {
          poNo: poNo,
          vendorId: first.VendorID,
          vendorName: vendMap[first.VendorID] || first.VendorID,
          currency: first.Currency || 'PKR',
          lines: lines.length,
          totalValue: Math.round(total * 100) / 100,
          status: worst,
          deliveryDate: first.DeliveryDate,
          createdOn: first.CreatedOn
        };
      });
      return out.reverse();
    },
    pur_createPO: (d) => {
      const db = getDB();
      db.seq.po++;
      const poNo = String(db.seq.po);
      const today = new Date().toISOString().slice(0,10);
      d.lines.forEach((l, i) => {
        const mat = db.materials.find(m => String(m.MaterialID) === String(l.materialId)) || {};
        db.pos.push({
          PONo: poNo,
          Line: (i + 1) * 10,
          PRRef: l.prRef || '',
          VendorID: d.vendorId,
          MaterialID: l.materialId,
          Description: mat.Description || '',
          Qty: Number(l.qty) || 0,
          UOM: mat.BaseUOM || 'PC',
          NetPrice: Number(l.netPrice) || 0,
          Currency: d.currency || 'PKR',
          DeliveryDate: l.deliveryDate || today,
          Plant: l.plant,
          SLoc: l.sloc,
          Status: 'Open',
          ReceivedQty: 0,
          CreatedOn: today
        });
        if(l.prRef){
          const prLine = db.prs.find(p => String(p.PRNo) === String(l.prRef) && String(p.MaterialID) === String(l.materialId));
          if(prLine) prLine.Status = 'Converted';
        }
      });
      saveDB(db);
      return { ok: true, poNo: poNo };
    },
    pur_getPO: (poNo) => {
      const db = getDB();
      const lines = db.pos.filter(p => String(p.PONo) === String(poNo));
      if(!lines.length) throw new Error('PO ' + poNo + ' not found');
      const vend = db.vendors.find(v => String(v.VendorID) === String(lines[0].VendorID)) || {};
      const worst = lines.some(l => l.Status === 'Open') ? 'Open' : (lines.some(l => l.Status === 'Partial') ? 'Partial' : 'Received');
      const total = lines.reduce((acc, l) => acc + (Number(l.Qty) || 0) * (Number(l.NetPrice) || 0), 0);
      const mappedLines = lines.map(l => {
        const qty = Number(l.Qty) || 0;
        const rec = Number(l.ReceivedQty) || 0;
        return Object.assign({}, l, { openQty: Math.max(0, qty - rec) });
      });
      return {
        header: {
          poNo: poNo,
          vendorId: lines[0].VendorID,
          vendorName: vend.Name || lines[0].VendorID,
          currency: lines[0].Currency || 'PKR',
          status: worst,
          totalValue: Math.round(total * 100) / 100,
          createdOn: lines[0].CreatedOn
        },
        lines: mappedLines
      };
    },
    pur_postGR: (d) => {
      const db = getDB();
      db.seq.gr++;
      const grNo = String(db.seq.gr);
      const today = d.postingDate || new Date().toISOString().slice(0,10);
      d.lines.forEach(item => {
        const poLine = db.pos.find(p => String(p.PONo) === String(d.poNo) && Number(p.Line) === Number(item.line));
        if(!poLine) return;
        const qty = Number(item.qty) || 0;
        poLine.ReceivedQty = (Number(poLine.ReceivedQty) || 0) + qty;
        poLine.Status = poLine.ReceivedQty >= Number(poLine.Qty) ? 'Received' : 'Partial';
        
        // Stock increase
        let stockRow = db.stock.find(s => String(s.MaterialID) === String(poLine.MaterialID) && String(s.Plant) === String(poLine.Plant) && String(s.SLoc) === String(poLine.SLoc));
        if(!stockRow){
          stockRow = { MaterialID: poLine.MaterialID, Plant: poLine.Plant, SLoc: poLine.SLoc, Quantity: 0, StockValue: 0 };
          db.stock.push(stockRow);
        }
        const unitPrice = Number(poLine.NetPrice) || 0;
        const oldMatRows = db.stock.filter(s => String(s.MaterialID) === String(poLine.MaterialID));
        const totalOldQty = oldMatRows.reduce((acc, s) => acc + (Number(s.Quantity) || 0), 0);
        const totalOldVal = oldMatRows.reduce((acc, s) => acc + (Number(s.StockValue) || 0), 0);
        
        const newTotalQty = totalOldQty + qty;
        const newTotalVal = totalOldVal + qty * unitPrice;
        const newMAP = newTotalQty > 0 ? Math.round((newTotalVal / newTotalQty) * 100) / 100 : unitPrice;

        stockRow.Quantity = (Number(stockRow.Quantity) || 0) + qty;
        stockRow.StockValue = (Number(stockRow.StockValue) || 0) + Math.round(qty * unitPrice * 100) / 100;

        // Update Material MAP
        const mat = db.materials.find(m => String(m.MaterialID) === String(poLine.MaterialID));
        if(mat) mat.MovingAvgPrice = newMAP;

        db.grs.push({
          GRNo: grNo, DocDate: today, PostingDate: today, PONo: d.poNo, POLine: poLine.Line,
          MaterialID: poLine.MaterialID, Qty: qty, UOM: poLine.UOM, Plant: poLine.Plant, SLoc: poLine.SLoc,
          MovementType: '101', RefDoc: d.poNo, CreatedBy: 'user'
        });

        db.seq.led++;
        db.ledger.push({
          LedgerID: 'L-' + String(db.seq.led).padStart(8, '0'),
          Timestamp: today + ' ' + new Date().toTimeString().slice(0,8),
          DocType: 'GR', DocNo: grNo, MaterialID: poLine.MaterialID,
          Plant: poLine.Plant, SLoc: poLine.SLoc, MovementType: '101',
          QtyChange: qty, ValueChange: Math.round(qty * unitPrice * 100) / 100,
          NewQty: stockRow.Quantity, NewValue: stockRow.StockValue, UnitPrice: unitPrice, CreatedBy: 'user'
        });
      });
      saveDB(db);
      return { ok: true, grNo: grNo };
    },
    pur_closePO: (poNo) => {
      const db = getDB();
      db.pos.filter(p => String(p.PONo) === String(poNo)).forEach(p => { p.Status = 'Closed'; });
      saveDB(db);
      return { ok: true };
    },
    pur_listGRs: () => getDB().grs.slice().reverse(),
    pur_reverseGR: (grNo, reason) => {
      const db = getDB();
      const hits = db.grs.filter(g => String(g.GRNo) === String(grNo) && g.MovementType === '101');
      if(!hits.length) throw new Error('Receipt not found or already reversed: ' + grNo);
      const today = new Date().toISOString().slice(0,10);
      hits.forEach(gr => {
        const stockRow = db.stock.find(s => String(s.MaterialID) === String(gr.MaterialID) && String(s.Plant) === String(gr.Plant) && String(s.SLoc) === String(gr.SLoc));
        if(!stockRow || Number(stockRow.Quantity) < Number(gr.Qty)) throw new Error('Insufficient stock to reverse receipt.');
        const poLine = db.pos.find(p => String(p.PONo) === String(gr.PONo) && Number(p.Line) === Number(gr.POLine));
        const unitPrice = poLine ? (Number(poLine.NetPrice) || 0) : 0;
        const valChange = Math.round(Number(gr.Qty) * unitPrice * 100) / 100;
        stockRow.Quantity -= Number(gr.Qty);
        stockRow.StockValue = Math.max(0, stockRow.StockValue - valChange);
        if(poLine) {
          poLine.ReceivedQty = Math.max(0, (Number(poLine.ReceivedQty) || 0) - Number(gr.Qty));
          poLine.Status = poLine.ReceivedQty <= 0 ? 'Open' : (poLine.ReceivedQty < Number(poLine.Qty) ? 'Partial' : 'Received');
        }
        db.seq.gr++;
        const revGrNo = '50' + String(db.seq.gr).padStart(8, '0');
        db.grs.push({
          GRNo: revGrNo, DocDate: today, PostingDate: today, PONo: gr.PONo, POLine: gr.POLine,
          MaterialID: gr.MaterialID, Qty: gr.Qty, UOM: gr.UOM, Plant: gr.Plant, SLoc: gr.SLoc,
          MovementType: '102', RefDoc: 'REV:' + grNo + (reason ? ' (' + reason + ')' : ''), CreatedBy: 'user'
        });
        db.seq.led++;
        db.ledger.push({
          LedgerID: 'L-' + String(db.seq.led).padStart(8, '0'),
          Timestamp: today + ' ' + new Date().toTimeString().slice(0,8),
          DocType: 'GR', DocNo: revGrNo, MaterialID: gr.MaterialID,
          Plant: gr.Plant, SLoc: gr.SLoc, MovementType: '102',
          QtyChange: -Number(gr.Qty), ValueChange: -valChange,
          NewQty: stockRow.Quantity, NewValue: stockRow.StockValue, UnitPrice: unitPrice, CreatedBy: 'user'
        });
      });
      saveDB(db);
      return { ok: true, message: 'Reversal posted.' };
    },
    inv_listStock: (f) => {
      f = f || {};
      const db = getDB();
      const mats = {};
      db.materials.forEach(m => { mats[m.MaterialID] = m; });
      const q = (f.q || '').toLowerCase();
      const out = [];
      db.stock.forEach(s => {
        const m = mats[s.MaterialID];
        if(!m) return;
        if(f.plant && s.Plant !== f.plant) return;
        if(f.sloc && s.SLoc !== f.sloc) return;
        const qty = Number(s.Quantity) || 0;
        const map = Number(m.MovingAvgPrice) || 0;
        const rp = Number(m.ReorderPoint) || 0;
        const low = qty <= rp;
        if(f.lowOnly && !low) return;
        if(q && !(s.MaterialID + ' ' + (m.Description||'')).toLowerCase().includes(q)) return;
        out.push({
          materialId: s.MaterialID,
          description: m.Description || '',
          materialType: m.MaterialType || '',
          plant: s.Plant,
          sloc: s.SLoc,
          qty: qty,
          uom: m.BaseUOM || '',
          map: map,

            materialId: m.MaterialID, description: m.Description,
            currentStock: current, reorderPoint: rp, suggestedQty: suggested,
            uom: m.BaseUOM, plant: m.Plant, sloc: sloc ? sloc.SLocID : '0001'
          });
        }
      });
      return suggestions;
    },
    rep_inventoryHealth: () => {
      const db = getDB();
      const mats = {};
      db.materials.forEach(m => { mats[m.MaterialID] = m; });
      let totalVal = 0;
      const valByType = {};
      const status = { normal: 0, low: 0, critical: 0 };
      const topItems = [];
      db.stock.forEach(s => {
        const m = mats[s.MaterialID];
        if(!m) return;
        const q = Number(s.Quantity) || 0;
        const map = Number(m.MovingAvgPrice) || 0;
        const v = Math.round(q * map * 100) / 100;
        const rp = Number(m.ReorderPoint) || 0;
        const t = m.MaterialType || 'OTHER';
        totalVal += v;
        valByType[t] = Math.round(((valByType[t] || 0) + v) * 100) / 100;
        if(q <= 0) status.critical++;
        else if(q <= rp) status.low++;
        else status.normal++;
        topItems.push({
          materialId: s.MaterialID, description: m.Description, type: t, qty: q, uom: m.BaseUOM, value: v
        });
      });
      topItems.sort((a,b) => b.value - a.value);
      return {
        totalValue: Math.round(totalVal * 100) / 100,
        valuationByType: valByType,
        stockStatus: status,
        topItems: topItems.slice(0, 5)
      };
    },
    rep_slowMovingStock: (thresholdDays) => {
      const db = getDB();
      const mats = {};
      db.materials.forEach(m => { mats[m.MaterialID] = m; });
      const threshold = Number(thresholdDays) || 60;
      const rows = [];
      let totalSlow = 0;
      db.stock.forEach(s => {
        const q = Number(s.Quantity) || 0;
        if(q <= 0) return;
        const m = mats[s.MaterialID];
        if(!m) return;
        const map = Number(m.MovingAvgPrice) || 0;
        const val = Math.round(q * map * 100) / 100;
        // Search ledger for issues
        const issues = db.ledger.filter(l => String(l.MaterialID) === String(s.MaterialID) && (l.MovementType === '201' || l.MovementType === '261' || l.MovementType === '601'));
        const lastIssue = issues.length ? issues[issues.length - 1].Timestamp.slice(0,10) : 'Never';
        totalSlow += val;
        rows.push({
          materialId: s.MaterialID, description: m.Description, materialType: m.MaterialType,
          plant: s.Plant, sloc: s.SLoc, qty: q, uom: m.BaseUOM, map: map, value: val,
          lastIssueDate: lastIssue, daysIdle: lastIssue === 'Never' ? 'No recorded issue' : 65
        });
      });
      rows.sort((a,b) => b.value - a.value);
      return { rows: rows, totalSlowValue: Math.round(totalSlow * 100) / 100, thresholdDays: threshold };
    },
    rep_vendorSpendAnalysis: () => {
      const db = getDB();
      const spend = {};
      db.vendors.forEach(v => {
        spend[v.VendorID] = {
          vendorId: v.VendorID, vendorName: v.Name, city: v.City, currency: v.Currency || 'PKR',
          poCount: 0, totalPoValue: 0, invoicedValue: 0, paidValue: 0
        };
      });
      const counted = {};
      db.pos.forEach(p => {
        const v = spend[p.VendorID];
        if(!v) return;
        if(!counted[p.PONo]){ counted[p.PONo] = true; v.poCount++; }
        v.totalPoValue += (Number(p.Qty) || 0) * (Number(p.NetPrice) || 0);
      });
      db.invoices.forEach(inv => {
        const v = spend[inv.VendorID];
        if(!v) return;
        const gross = Number(inv.GrossAmount) || 0;
        v.invoicedValue += gross;
        if(inv.Status === 'Paid') v.paidValue += gross;
      });
      const rows = Object.values(spend).map(r => {
        r.totalPoValue = Math.round(r.totalPoValue * 100) / 100;
        r.invoicedValue = Math.round(r.invoicedValue * 100) / 100;
        r.paidValue = Math.round(r.paidValue * 100) / 100;
        return r;
      });
      rows.sort((a,b) => b.totalPoValue - a.totalPoValue);
      return { rows: rows };
    },
    rep_auditStockLedger: () => {
      const db = getDB();
      const mats = {};
      db.materials.forEach(m => { mats[m.MaterialID] = m; });
      const ledgerSums = {};
      db.ledger.forEach(l => {
        const k = l.MaterialID + '|' + l.Plant + '|' + l.SLoc;
        ledgerSums[k] = (ledgerSums[k] || 0) + (Number(l.QtyChange) || 0);
      });
      const results = [];
      let hasDiscrepancy = false;
      db.stock.forEach(s => {
        const k = s.MaterialID + '|' + s.Plant + '|' + s.SLoc;
        const stockQty = Math.round((Number(s.Quantity) || 0) * 1000) / 1000;
        const ledgerQty = Math.round((ledgerSums[k] || 0) * 1000) / 1000;
        const diff = Math.round((stockQty - ledgerQty) * 1000) / 1000;
        const isMatch = Math.abs(diff) < 0.0001;
        if(!isMatch) hasDiscrepancy = true;
        const m = mats[s.MaterialID];
        results.push({
          materialId: s.MaterialID, description: m ? m.Description : '',
          plant: s.Plant, sloc: s.SLoc, stockQty: stockQty, ledgerQty: ledgerQty,
          diff: diff, status: isMatch ? 'VERIFIED' : 'DISCREPANCY'
        });
      });
      return {
        verified: !hasDiscrepancy,
        totalChecked: results.length,
        discrepancyCount: results.filter(r => r.status === 'DISCREPANCY').length,
        rows: results
      };
    },
    rep_reconcileAndFixStock: () => {
      return { ok: true, message: 'Stock integrity check passed: balances match transaction ledger.', fixedCount: 0 };
    },
    rep_exportReportToSheet: (reportType) => {
      return { ok: true, sheetName: 'Report_' + (reportType || 'EXPORT').toUpperCase(), rowCount: 10 };
    },
    alert_sendLowStockDigest: (email) => {
      const db = getDB();
      const low = db.stock.filter(s => {
        const m = db.materials.find(x => String(x.MaterialID) === String(s.MaterialID));
        return m && (Number(s.Quantity) || 0) <= (Number(m.ReorderPoint) || 0);
      });
      return { ok: true, sentTo: email || db.config.email, count: low.length };
    },
    setupDailyLowStockTrigger: () => ({ ok: true, message: 'Daily low-stock trigger enabled (08:00 AM).' }),
    removeLowStockTrigger: () => ({ ok: true, removed: 1 }),
    getTriggerStatus: () => ({ dailyAlertScheduled: true, totalTriggers: 1 }),
    doc_getDocumentForPrint: (docNo) => {
      if(!docNo) throw new Error('Document number is required.');
      const target = String(docNo).trim().toLowerCase();
      const cleanTarget = target.replace(/^(po|so|gr|gi|del|dn|inv|pr|tr|tp|res|adj)[-_#\s]*/i, '');
      const db = getDB();

      const match = (val) => {
        if(!val) return false;
        const sVal = String(val).trim().toLowerCase();
        if(sVal === target) return true;
        const cleanVal = sVal.replace(/^(po|so|gr|gi|del|dn|inv|pr|tr|tp|res|adj)[-_#\s]*/i, '');
        return Boolean(cleanVal && cleanVal === cleanTarget);
      };

      // 1. PO
      const poLines = db.pos.filter(p => match(p.PONo));
      if(poLines.length > 0){
        const v = db.vendors.find(x => String(x.VendorID) === String(poLines[0].VendorID));
        const total = poLines.reduce((s, l) => s + (Number(l.Qty)||0)*(Number(l.NetPrice)||0), 0);
        return {
          ok: true, docType: 'PO', docNo: poLines[0].PONo,
          data: {
            header: {
              poNo: poLines[0].PONo,
              vendorId: poLines[0].VendorID,
              vendorName: v ? v.Name : poLines[0].VendorID,
              currency: poLines[0].Currency || db.config.currency,
              status: poLines[0].Status,
              totalValue: total,
              createdOn: poLines[0].CreatedOn
            },
            lines: poLines.map(l => ({
              line: l.Line,
              materialId: l.MaterialID,
              description: l.Description,
              qty: l.Qty,
              uom: l.UOM,
              netPrice: l.NetPrice,
              deliveryDate: l.DeliveryDate,
              receivedQty: l.ReceivedQty,
              openQty: (Number(l.Qty)||0) - (Number(l.ReceivedQty)||0)
            }))
          }
        };
      }

      // 2. SO
      const soLines = db.sos.filter(s => match(s.SONo));
      if(soLines.length > 0){
        const c = db.customers.find(x => String(x.CustomerID) === String(soLines[0].CustomerID));
        const total = soLines.reduce((s, l) => s + (Number(l.Qty)||0)*(Number(l.NetPrice)||0), 0);
        return {
          ok: true, docType: 'SO', docNo: soLines[0].SONo,
          data: {
            header: {
              soNo: soLines[0].SONo,
              customerId: soLines[0].CustomerID,
              customerName: c ? c.Name : soLines[0].CustomerID,
              currency: soLines[0].Currency || db.config.currency,
              status: soLines[0].Status,
              totalValue: total,
              createdOn: soLines[0].CreatedOn
            },
            lines: soLines.map(l => ({
              line: l.Line,
              materialId: l.MaterialID,
              description: l.Description,
              qty: l.Qty,
              uom: l.UOM,
              netPrice: l.NetPrice,
              deliveredQty: l.DeliveredQty,
              reqDelDate: l.ReqDelDate
            }))
          }
        };
      }

      // 3. GR
      const grLines = db.grs.filter(g => match(g.GRNo));
      if(grLines.length > 0){
        const matMap = {};
        db.materials.forEach(m => { matMap[m.MaterialID] = m.Description; });
        const lines = grLines.map(g => ({
          grNo: g.GRNo,
          poNo: g.PONo,
          line: g.POLine,
          materialId: g.MaterialID,
          description: matMap[g.MaterialID] || g.Description || '',
          qty: g.Qty,
          uom: g.UOM,
          plant: g.Plant,
          sloc: g.SLoc,
          movementType: g.MovementType || '101',
          docDate: g.DocDate,
          postingDate: g.PostingDate,
          refDoc: g.RefDoc
        }));
        return {
          ok: true, docType: 'GR', docNo: grLines[0].GRNo,
          data: { header: lines[0], lines: lines }
        };
      }

      // 4. GI
      const gi = db.gis.find(g => match(g.GINo));
      if(gi){
        const m = db.materials.find(x => String(x.MaterialID) === String(gi.MaterialID));
        return {
          ok: true, docType: 'GI', docNo: gi.GINo,
          data: {
            giNo: gi.GINo,
            docDate: gi.DocDate,
            postingDate: gi.PostingDate,
            materialId: gi.MaterialID,
            description: m ? m.Description : '',
            qty: gi.Qty,
            uom: gi.UOM,
            plant: gi.Plant,
            sloc: gi.SLoc,
            movementType: gi.MovementType || '201',
            costCenter: gi.CostCenter || '',
            reason: gi.Reason || '',
            createdBy: gi.CreatedBy || 'system'
          }
        };
      }

      // 5. Deliveries
      const delLines = db.deliveries.filter(d => match(d.DelNo));
      if(delLines.length > 0){
        const matMap = {};
        db.materials.forEach(m => { matMap[m.MaterialID] = m.Description; });
        const lines = delLines.map(d => ({
          delNo: d.DelNo,
          soNo: d.SONo,
          line: d.SOLine,
          materialId: d.MaterialID,
          description: matMap[d.MaterialID] || '',
          qty: d.Qty,
          uom: d.UOM,
          plant: d.Plant,
          sloc: d.SLoc,
          docDate: d.DocDate,
          movementType: d.MovementType || '601'
        }));
        return {
          ok: true, docType: 'DN', docNo: delLines[0].DelNo,
          data: { header: lines[0], lines: lines }
        };
      }

      // 6. Invoices
      const inv = db.invoices.find(i => match(i.InvNo));
      if(inv){
        const v = db.vendors.find(x => String(x.VendorID) === String(inv.VendorID));
        return {
          ok: true, docType: 'INV', docNo: inv.InvNo,
          data: {
            invNo: inv.InvNo,
            docDate: inv.DocDate,
            poNo: inv.PONo,
            grNo: inv.GRNo,
            vendorId: inv.VendorID,
            vendorName: v ? v.Name : inv.VendorID,
            grossAmount: inv.GrossAmount,
            taxAmount: inv.TaxAmount || 0,
            currency: inv.Currency || db.config.currency,
            status: inv.Status
          }
        };
      }

      // 7. PR
      const prLines = db.prs.filter(p => match(p.PRNo));
      if(prLines.length > 0){
        return {
          ok: true, docType: 'PR', docNo: prLines[0].PRNo,
          data: {
            header: { prNo: prLines[0].PRNo, createdOn: prLines[0].CreatedOn, status: prLines[0].Status },
            lines: prLines.map(l => ({
              line: l.Line,
              materialId: l.MaterialID,
              description: l.Description,
              qty: l.Qty,
              uom: l.UOM,
              reqDate: l.ReqDate,
              plant: l.Plant,
              sloc: l.SLoc,
              status: l.Status
            }))
          }
        };
      }

      // 8. Stock Transfers / Adjustments from Ledger
      const trLines = db.ledger.filter(l => (l.DocType === 'TR' || l.DocType === 'ADJ') && match(l.DocNo));
      if(trLines.length > 0){
        const m = db.materials.find(x => String(x.MaterialID) === String(trLines[0].MaterialID));
        return {
          ok: true, docType: trLines[0].DocType, docNo: trLines[0].DocNo,
          data: {
            docNo: trLines[0].DocNo,
            docType: trLines[0].DocType,
            timestamp: trLines[0].Timestamp,
            materialId: trLines[0].MaterialID,
            description: m ? m.Description : '',
            lines: trLines
          }
        };
      }

      throw new Error('Document "' + docNo + '" was not found across ERP records.');
    },

    doc_getRecentDocuments: () => {
      const db = getDB();
      const list = [];
      const seen = new Set();

      (db.pos || []).slice().reverse().forEach(p => {
        if(seen.has('PO_' + p.PONo)) return;
        seen.add('PO_' + p.PONo);
        list.push({ docNo: p.PONo, docType: 'PO', date: p.CreatedOn, ref: p.Description || p.VendorID, value: (Number(p.Qty)||0)*(Number(p.NetPrice)||0), status: p.Status });
      });

      (db.grs || []).slice().reverse().forEach(g => {
        if(seen.has('GR_' + g.GRNo)) return;
        seen.add('GR_' + g.GRNo);
        list.push({ docNo: g.GRNo, docType: 'GR', date: g.PostingDate || g.DocDate, ref: 'PO ' + g.PONo + ' · ' + g.MaterialID, value: g.Qty + ' ' + (g.UOM||''), status: 'Posted' });
      });

      (db.gis || []).slice().reverse().forEach(g => {
        if(seen.has('GI_' + g.GINo)) return;
        seen.add('GI_' + g.GINo);
        list.push({ docNo: g.GINo, docType: 'GI', date: g.PostingDate || g.DocDate, ref: (g.CostCenter || g.Reason || 'Stock Issue') + ' · ' + g.MaterialID, value: g.Qty + ' ' + (g.UOM||''), status: 'Posted' });
      });

      (db.sos || []).slice().reverse().forEach(s => {
        if(seen.has('SO_' + s.SONo)) return;
        seen.add('SO_' + s.SONo);
        list.push({ docNo: s.SONo, docType: 'SO', date: s.CreatedOn, ref: s.Description || s.CustomerID, value: (Number(s.Qty)||0)*(Number(s.NetPrice)||0), status: s.Status });
      });

      (db.deliveries || []).slice().reverse().forEach(d => {
        if(seen.has('DEL_' + d.DelNo)) return;
        seen.add('DEL_' + d.DelNo);
        list.push({ docNo: d.DelNo, docType: 'DN', date: d.DocDate, ref: 'SO ' + d.SONo + ' · ' + d.MaterialID, value: d.Qty + ' ' + (d.UOM||''), status: 'Dispatched' });
      });

      (db.invoices || []).slice().reverse().forEach(i => {
        if(seen.has('INV_' + i.InvNo)) return;
        seen.add('INV_' + i.InvNo);
        list.push({ docNo: i.InvNo, docType: 'INV', date: i.DocDate, ref: 'PO ' + i.PONo + ' · ' + i.VendorID, value: i.GrossAmount, status: i.Status });
      });

      (db.prs || []).slice().reverse().forEach(p => {
        if(seen.has('PR_' + p.PRNo)) return;
        seen.add('PR_' + p.PRNo);
        list.push({ docNo: p.PRNo, docType: 'PR', date: p.CreatedOn, ref: p.Description || p.MaterialID, value: p.Qty + ' ' + (p.UOM||''), status: p.Status });
      });

      return list.slice(0, 30);
    }
  };
})();

/* Unified API Dispatcher: uses google.script.run in GAS, and MockERP in standalone preview */
function api(name, params){
  return new Promise((resolve, reject)=>{
    if(hasGasBackend()){
      try{
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err=>reject(new Error((err && err.message) || String(err))));
        if(params === undefined) runner[name]();
        else runner[name](params);
      }catch(e){ reject(e); }
      return;
    }
    // Standalone simulation mode
    setTimeout(()=>{
      try{
        if(typeof MockERP[name] === 'function'){
          const res = MockERP[name](params);
          resolve(res);
        } else {
          reject(new Error('Backend method ' + name + ' is not implemented.'));
        }
      }catch(e){ reject(e); }
    }, 60);
  });
}

  const t = res.docType;

  if(t === 'PO') return buildPOSlipData(d);

  if(t === 'GR') return buildGRSlipData(d);
  if(t === 'GI') return buildGISlipData(d);
  if(t === 'DN') return buildDelSlipData(d);
  if(t === 'INV') return buildInvSlipData(d);
  if(t === 'PR') return buildPRSlipData(d);
  if(t === 'TR' || t === 'ADJ') return buildTRSlipData(d);
  return {
    title: 'Document — ' + res.docNo,
    metaHtml: '<div class="doc-meta"><div><b>Doc No:</b> ' + esc(res.docNo) + '</div><div><b>Type:</b> ' + esc(res.docType) + '</div></div>',
    tableHtml: '<tbody><tr><td><pre>' + esc(JSON.stringify(d, null, 2)) + '</pre></td></tr></tbody>'
  };
}

/**
 * Universal document search and print by typing document number.
 */
async function printDocumentByNumber(docNo){
  if(!docNo) return toast('Please enter a document number.', 'warning');
  const target = String(docNo).trim();
  try {
    showLoading('Looking up document ' + target + '...');
    const res = await api('doc_getDocumentForPrint', target);
    hideLoading();
    if(!res || !res.ok){
      toast('Document not found: ' + target, 'error');
      return;
    }
    const payload = getSlipPayload(res);
    openDocSlip(payload.title, payload);
  } catch(e) {
    hideLoading();
    toast(e.message || ('Failed to load document ' + target), 'error');
  }
}

/* ---------- Toast ---------- */
function toast(msg, type){
  type = type || 'info';
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const titles = {success:'Success', error:'Error', warning:'Warning', info:'Info'};
  el.innerHTML = '<div><div class="t-title">'+esc(titles[type]||'Info')+'</div><div>'+msg+'</div></div>';
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .4s'; setTimeout(()=>el.remove(), 420); }, 4200);
}

/* ---------- Loading overlay ---------- */
let _loadCount = 0;
function showLoading(msg){
  _loadCount++;
  const l = document.getElementById('loading');
  if(msg) l.querySelector('.msg').textContent = msg;
  l.classList.add('open');
}
function hideLoading(){
  _loadCount = Math.max(0, _loadCount-1);
  if(_loadCount===0) document.getElementById('loading').classList.remove('open');
}

/* ---------- Modal ---------- */
let _modalOnSubmit = null;
function openModal(title, bodyHTML, opts){
  opts = opts || {};
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  const foot = document.getElementById('modalFoot');
  foot.innerHTML = '';
  document.getElementById('modalBox').classList.toggle('wide', !!opts.wide);
  const cancel = document.createElement('button');
  cancel.className = 'btn'; cancel.textContent = opts.cancelLabel || 'Cancel';
  cancel.onclick = closeModal;
  foot.appendChild(cancel);
  _modalOnSubmit = opts.onSubmit || null;
  if(opts.submitLabel){
    const ok = document.createElement('button');
    ok.className = 'btn ' + (opts.submitClass || 'btn-primary');
    ok.textContent = opts.submitLabel;
    ok.onclick = ()=>{ if(_modalOnSubmit) _modalOnSubmit(); };
    foot.appendChild(ok);
  }
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  _modalOnSubmit = null;
}
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- Formatting ---------- */
function esc(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtNum(n, d){
  if(d===undefined) d=2;
  n = Number(n); if(!isFinite(n)) n=0;
  return n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtQty(n){
  n = Number(n); if(!isFinite(n)) n=0;
  return n.toLocaleString('en-US',{minimumFractionDigits:0, maximumFractionDigits:3});
}
function fmtMoney(n){
  return fmtNum(n,2) + ' ' + esc(state.config.currency || 'USD');
}
function fmtDate(s){
  if(!s) return '';
  const d = new Date(s);
  if(isNaN(d.getTime())) return esc(String(s));
  const p = x => String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function todayInput(){
  const d = new Date(), p = x => String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

/* ---------- Mixed key helpers (sheet rows vs joined rows) ---------- */
function pick(row){
  for(let i=1;i<arguments.length;i++){
    const k = arguments[i];
    if(row && row[k]!==undefined && row[k]!==null && row[k]!=='') return row[k];
  }
  return '';
}

    h += '<option value="'+esc(v)+'"'+(String(v)===String(selected??'')?' selected':'')+'>'+esc(lbl)+'</option>';

}

/* ---------- Table renderer ---------- */
function renderTable(el, cols, rows, opts){
  opts = opts || {};
  if(typeof el === 'string') el = document.getElementById(el);
  if(!rows || !rows.length){
    el.innerHTML = '<div class="tbl-wrap"><div class="empty-state">No records found.</div></div>';
    return;
  }
  let h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>';
  for(const c of cols){
    const cls = c.align==='right'?'num':(c.align==='center'?'ctr':'');
    h += '<th class="'+cls+'">'+esc(c.label)+'</th>';
  }
  if(opts.actions && opts.actions.length) h += '<th class="ctr">Actions</th>';
  h += '</tr></thead><tbody>';
  rows.forEach((row, i)=>{
    h += '<tr'+(opts.onRowClick?' class="clickable" data-ri="'+i+'"':'')+'>';
    for(const c of cols){
      let v = row[c.key];
      if(c.fmt) v = c.fmt(v, row);
      else v = esc(v);
      const cls = c.align==='right'?'num':(c.align==='center'?'ctr':'');
      h += '<td class="'+cls+'">'+v+'</td>';
    }
    if(opts.actions && opts.actions.length){
      h += '<td class="ctr row-actions">';
      for(const a of opts.actions){
        if(a.when && !a.when(row)) continue;
        h += '<button class="btn btn-sm '+esc(a.cls||'')+'" data-act="'+esc(a.act)+'" data-ri="'+i+'">'+esc(a.label)+'</button>';
      }
      h += '</td>';
    }
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  el.innerHTML = h;
  const tb = el.querySelector('tbody');
  tb.addEventListener('click', e=>{
    const b = e.target.closest('button[data-act]');
    if(b){
      e.stopPropagation();
      if(opts.onAction) opts.onAction(b.getAttribute('data-act'), rows[Number(b.getAttribute('data-ri'))]);
      return;
    }
    const tr = e.target.closest('tr[data-ri]');
    if(tr && opts.onRowClick) opts.onRowClick(rows[Number(tr.getAttribute('data-ri'))]);
  });
}

/* ---------- CSV export ---------- */
function downloadCSV(filename, cols, rows){
  const q = v => '"'+String(v===null||v===undefined?'':v).replace(/"/g,'""')+'"';
  let csv = cols.map(c=>q(c.label)).join(',')+'\n';
  for(const r of rows){
    csv += cols.map(c=>{
      let v = r[c.key];
      if(c.csv) v = c.csv(v, r);
      else if(typeof v==='number') v = v;
      return q(v);
    }).join(',')+'\n';
  }
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('CSV exported: '+filename, 'success');
}

function addDynRow(tbodyId, cellsHTML){
  const tb = document.getElementById(tbodyId);
  const tr = document.createElement('tr');
  tr.innerHTML = cellsHTML +
    '<td class="ctr"><button type="button" class="btn btn-sm btn-danger" data-del>Remove</button></td>';
  tr.querySelector('[data-del]').onclick = ()=>tr.remove();
  tb.appendChild(tr);
  return tr;
}
function readDynRows(tbodyId){
  const tb = document.getElementById(tbodyId);
  const out = [];
  tb.querySelectorAll('tr').forEach(tr=>{
    const o = {};
    tr.querySelectorAll('[data-f]').forEach(inp=>{ o[inp.getAttribute('data-f')] = inp.value; });
    out.push(o);
  });
  return out;
}
function bindPlantSloc(plantSel, slocSel, onChange){
  plantSel.addEventListener('change', async ()=>{
    const pid = plantSel.value;
    slocSel.innerHTML = '<option value="">--</option>';
    if(!pid) return;
    try{
      const slocs = await api('md_listSLocs', pid);
      slocSel.innerHTML = selectOptions(slocs, s=>s.SLocID||s.slocId,
        s=>(s.SLocID||s.slocId)+' — '+(s.Description||s.description||''));
    }catch(e){ toast('Failed to load storage locations: '+esc(e.message),'error'); }
    if(onChange) onChange();
  });
}
function debounce(fn, ms){
  let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms||300); };
}

function buildNav(){

function setActiveNav(id){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-view')===id);
  });
  const v = NAV.find(x=>x.id===id);
  document.getElementById('viewTitle').textContent = v ? v.label : id;
}
async function nav(view){
  setActiveNav(view);

    c.innerHTML = '<div class="card"><h3>Error</h3><p class="muted">'+esc(e.message)+'</p></div>';
    toast('Failed to load view: '+esc(e.message), 'error');
  }finally{

  }
}

function openBulkMaterialModal(){
  const sample = 'Description,Type,UOM,StdPrice,ReorderPoint,Plant\nAluminum Ingot,ROH,KG,420,100,1000\nPlastic Granules,ROH,KG,85,300,1000\nRubber Seal,HALB,PC,25,250,1000';
  const body =
    '<p class="small muted mb">Paste CSV rows (Description, Type, UOM, StdPrice, ReorderPoint, Plant):</p>'+
    '<textarea id="bulkMatText" style="width:100%;height:130px;font-family:monospace;font-size:12px;padding:8px;border:1px solid var(--border);border-radius:6px;box-sizing:border-box;">'+sample+'</textarea>'+
    '<div class="small muted mt">Headers are optional. Standard price also initializes initial moving average price.</div>';
  openModal('Bulk Import Materials', body, {
    submitLabel: 'Import Now',
    onSubmit: async ()=>{
      const text = document.getElementById('bulkMatText').value.trim();
      if(!text) return;
      const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
      const rows = [];
      lines.forEach((l, idx)=>{
        if(idx === 0 && l.toLowerCase().startsWith('description')) return;
        const parts = l.split(',').map(p=>p.trim());
        if(parts.length < 1 || !parts[0]) return;
        rows.push({
          description: parts[0],
          materialType: parts[1] || 'ROH',
          baseUom: parts[2] || 'PC',
          stdPrice: Number(parts[3]) || 0,
          reorderPoint: Number(parts[4]) || 0,
          plant: parts[5] || '1000'
        });
      });
      if(!rows.length){ toast('No valid materials to import.','warning'); return; }
      showLoading('Importing materials...');
      try {
        const res = await api('md_bulkImportMaterials', rows);
        toast('Successfully imported ' + res.count + ' material(s).', 'success');
        closeModal();
        nav('materials');
      } catch(e) { toast('Bulk import error: ' + esc(e.message), 'error'); }
      finally { hideLoading(); }
    }
  });
}
function openMaterialModal(m){
  const isNew = !m;

  const body =

    '<div class="fld"><label>Description <span class="req">*</span></label><input type="text" id="f_Desc" value="'+esc(t.Description||'')+'"></div>'+

    '<div class="fld"><label>Base UOM</label><select id="f_UOM"><option value="">--</option>'+selectOptions(state.uoms,x=>x,x,t.BaseUOM)+'</select></div>'+
    '<div class="fld"><label>Valuation Class</label><input type="text" id="f_VClass" value="'+esc(t.ValuationClass||'')+'"></div>'+
    '<div class="fld"><label>Standard Price</label><input type="number" id="f_Std" step="0.01" min="0" value="'+esc(t.StdPrice??'')+'"></div>'+
    '<div class="fld"><label>Reorder Point</label><input type="number" id="f_RoP" step="0.001" min="0" value="'+esc(t.ReorderPoint??'')+'"></div>'+
    '<div class="fld"><label>Plant</label><select id="f_Plant"><option value="">--</option>'+plantOptions(t.Plant)+'</select></div>'+

        Description: desc,
        MaterialType: document.getElementById('f_MType').value,
        MaterialGroup: document.getElementById('f_MGroup').value.trim(),
        BaseUOM: document.getElementById('f_UOM').value,
        ValuationClass: document.getElementById('f_VClass').value.trim(),
        StdPrice: Number(document.getElementById('f_Std').value)||0,
        ReorderPoint: Number(document.getElementById('f_RoP').value)||0,

        return '<tr><td>'+esc(pick(l,'Line','line'))+'</td>'+
        '<td>'+esc(pick(l,'MaterialID','materialId'))+(pick(l,'Description','description')?' <span class="muted small">'+esc(pick(l,'Description','description'))+'</span>':'')+'</td>'+
        '<td class="num">'+fmtQty(pick(l,'Qty','qty'))+'</td>'+
        '<td class="num">'+fmtQty(pick(l,'ReceivedQty','receivedQty'))+'</td>'+
        '<td class="num"><b>'+fmtQty(open)+'</b></td>'+
        '<td class="num">'+fmtNum(pick(l,'NetPrice','netPrice'))+'</td>'+
        '<td>'+esc(pick(l,'Plant','plant'))+' / '+esc(pick(l,'SLoc','sloc'))+'</td>'+
        '<td class="ctr">'+statusPill(open>0?'Open':'Closed')+'</td></tr>';

  async function openGRModal(po){
    const open = (po.lines||[]).filter(l=>(Number(pick(l,'OpenQty','openQty'))||0)>0);
    const h = po.header||{};
    const poNo = pick(h,'PONo','poNo');

        '<td>'+esc(pick(l,'Plant','plant'))+' / '+esc(pick(l,'SLoc','sloc'))+'</td></tr>').join('')+
      '</tbody></table></div>';
    openModal('Goods Receipt — PO '+esc(poNo), body, {wide:true, submitLabel:'Post GR',
      onSubmit: async ()=>{
        const lines = [];
        document.querySelectorAll('[data-grline]').forEach(inp=>{

        try{ showLoading('Posting GR...');

          hideLoading(); closeModal();
          toast('Goods receipt '+(r.grNo||'')+' posted.','success'); renderPOTab();

      }});

};

Views.inventory = async function(c){
  if(!state.plants.length) state.plants = await api('md_listPlants');

  let tab = 'gr';

          finally { hideLoading(); }

      }});

};

/* ================================================================

   ================================================================ */
Views.sales = async function(c){
  if(!state.plants.length) state.plants = await api('md_listPlants');
  if(!state.materials.length) state.materials = await api('md_listMaterials','');
  if(!state.customers.length) state.customers = await api('md_listCustomers','');

    '<div id="salBody"></div>';
  c.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
    c.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); tab = t.getAttribute('data-t');

  async function renderSOTab(){

      '<div class="card"><div id="soTbl"></div></div>';

    const rows = await api('sal_listSOs',{});
    renderTable('soTbl',[
      {key:'soNo',label:'SO No',fmt:(v,r)=>esc(pick(r,'soNo','SONo'))},
      {key:'customerName',label:'Customer',fmt:(v,r)=>esc(pick(r,'customerName','CustomerName')||pick(r,'customerId','CustomerID'))},
      {key:'lines',label:'Lines',align:'center'},
      {key:'totalValue',label:'Total',align:'right',fmt:(v,r)=>fmtMoney(pick(r,'totalValue','TotalValue'))},
      {key:'status',label:'Status',align:'center',fmt:(v,r)=>statusPill(pick(r,'status','Status'))},
      {key:'createdOn',label:'Created',fmt:(v,r)=>fmtDate(pick(r,'createdOn','CreatedOn'))}
    ], rows, { actions:[
        {act:'view',label:'View',cls:'btn-primary'},
        {act:'deliver',label:'Deliver',cls:'btn-success',when:r=>String(pick(r,'status','Status')).toLowerCase()==='open'}
      ],
      onAction:(act,row)=>{
        const soNo = pick(row,'soNo','SONo');
        act==='view' ? openSODetail(soNo) : openDeliveryModal(soNo);
      }});
  }
  function soLineCells(){
    return '<td><select data-f="materialId" style="min-width:200px">'+materialOptions()+'</select></td>'+
      '<td><input type="number" data-f="qty" step="0.001" min="0.001" style="width:80px"></td>'+
      '<td><input type="number" data-f="netPrice" step="0.01" min="0" style="width:90px"></td>'+
      '<td><input type="date" data-f="reqDelDate" value="'+todayInput()+'"></td>'+
      '<td><select data-f="plant" class="ln-plant"><option value="">--</option>'+plantOptions()+'</select></td>'+
      '<td><select data-f="sloc" class="ln-sloc"><option value="">--</option></select></td>';
  }
  function openSOModal(){
    const body =
      '<div class="form-grid mb">'+
      '<div class="fld"><label>Customer <span class="req">*</span></label><select id="so_Cust">'+customerOptions()+'</select></div>'+
      '<div class="fld"><label>Currency</label><input type="text" id="so_Curr" value="'+esc(state.config.currency)+'" maxlength="3"></div>'+
      '</div>'+
      '<div class="tbl-wrap mb"><table class="tbl"><thead><tr>'+
      '<th>Material</th><th>Qty</th><th>Net Price</th><th>Req Del Date</th><th>Plant</th><th>SLoc</th><th></th></tr></thead>'+
      '<tbody id="soLines"></tbody></table></div>'+
      '<button class="btn btn-sm" id="addSOLine">+ Add Line</button>';
    openModal('New Sales Order', body, {wide:true, submitLabel:'Create SO',
      onSubmit: async ()=>{
        const customerId = document.getElementById('so_Cust').value;
        if(!customerId){ toast('Select a customer.','warning'); return; }
        const lines = readDynRows('soLines').map(l=>({
          materialId:l.materialId, qty:Number(l.qty)||0, netPrice:Number(l.netPrice)||0,
          reqDelDate:l.reqDelDate, plant:l.plant, sloc:l.sloc
        })).filter(l=>l.materialId && l.qty>0 && l.plant);
        if(!lines.length){ toast('Add at least one valid line.','warning'); return; }
        try{ showLoading('Creating SO...');
          const r = await api('sal_createSO',{customerId, currency:document.getElementById('so_Curr').value||state.config.currency, lines});
          hideLoading(); closeModal();
          toast('Sales order '+(r.soNo||'')+' created.','success'); renderSOTab();
        }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); }
      }});
    const add = ()=>{ const tr = addDynRow('soLines', soLineCells());
      bindPlantSloc(tr.querySelector('.ln-plant'), tr.querySelector('.ln-sloc')); };
    document.getElementById('addSOLine').onclick = add; add();
  }
  async function openSODetail(soNo){
    showLoading('Loading SO...');
    let so;
    try{ so = await api('sal_getSO', soNo); }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); return; }
    hideLoading();
    const h = so.header||{};
    const body = '<div class="toolbar mb"><span class="grow"></span><button class="btn btn-sm btn-link" id="soPrintSlipBtn">&#128438; Print SO Slip</button></div>' +
      '<div class="form-grid mb">'+
      '<div class="fld"><label>SO Number</label><div><b>'+esc(pick(h,'SONo','soNo'))+'</b></div></div>'+
      '<div class="fld"><label>Customer</label><div>'+esc(pick(h,'CustomerName','customerName')||pick(h,'CustomerID','customerId'))+'</div></div>'+
      '<div class="fld"><label>Status</label><div>'+statusPill(pick(h,'Status','status'))+'</div></div>'+
      '<div class="fld"><label>Total</label><div><b>'+fmtMoney(pick(h,'TotalValue','totalValue'))+'</b></div></div></div>'+
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
      '<th>Line</th><th>Material</th><th class="num">Qty</th><th class="num">Delivered</th><th class="num">Open</th>'+
      '<th class="num">Net Price</th><th>Plant/SLoc</th><th>Req Del Date</th></tr></thead><tbody>'+
      (so.lines||[]).map(l=>{
        const open = Number(pick(l,'OpenQty','openQty'))||0;
        return '<tr><td>'+esc(pick(l,'Line','line'))+'</td>'+
        '<td>'+esc(pick(l,'MaterialID','materialId'))+(pick(l,'Description','description')?' <span class="muted small">'+esc(pick(l,'Description','description'))+'</span>':'')+'</td>'+
        '<td class="num">'+fmtQty(pick(l,'Qty','qty'))+'</td>'+
        '<td class="num">'+fmtQty(pick(l,'DeliveredQty','deliveredQty'))+'</td>'+
        '<td class="num"><b>'+fmtQty(open)+'</b></td>'+
        '<td class="num">'+fmtNum(pick(l,'NetPrice','netPrice'))+'</td>'+
        '<td>'+esc(pick(l,'Plant','plant'))+' / '+esc(pick(l,'SLoc','sloc'))+'</td>'+
        '<td>'+fmtDate(pick(l,'ReqDelDate','reqDelDate'))+'</td></tr>';
      }).join('')+'</tbody></table></div>';
    const canDel = (so.lines||[]).some(l=>(Number(pick(l,'OpenQty','openQty'))||0)>0);
    openModal('Sales Order '+esc(soNo), body, {wide:true, submitLabel: canDel?'Post Delivery':null,
      onSubmit: canDel ? ()=>openDeliveryModal(soNo) : null});
    setTimeout(()=>{ const btn = document.getElementById('soPrintSlipBtn'); if(btn) btn.onclick = ()=>printSOSlip(so); }, 50);
  }
  async function openDeliveryModal(soNo){
    showLoading('Loading SO...');
    let so;
    try{ so = await api('sal_getSO', soNo); }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); return; }
    hideLoading();
    const open = (so.lines||[]).filter(l=>(Number(pick(l,'OpenQty','openQty'))||0)>0);
    if(!open.length){ toast('No open quantities on this order.','warning'); return; }
    const body =
      '<div class="fld mb" style="max-width:220px"><label>Posting Date</label><input type="date" id="del_Date" value="'+todayInput()+'"></div>'+
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Line</th><th>Material</th><th class="num">Open Qty</th><th>Deliver Qty</th><th>Plant/SLoc</th></tr></thead><tbody>'+
      open.map(l=>'<tr><td>'+esc(pick(l,'Line','line'))+'</td>'+
        '<td>'+esc(pick(l,'MaterialID','materialId'))+'</td>'+
        '<td class="num">'+fmtQty(pick(l,'OpenQty','openQty'))+'</td>'+
        '<td><input type="number" data-delline="'+esc(pick(l,'Line','line'))+'" value="'+esc(pick(l,'OpenQty','openQty'))+'" step="0.001" min="0" max="'+esc(pick(l,'OpenQty','openQty'))+'" style="width:100px"></td>'+
        '<td>'+esc(pick(l,'Plant','plant'))+' / '+esc(pick(l,'SLoc','sloc'))+'</td></tr>').join('')+
      '</tbody></table></div>'+
      '<p class="small muted mt">Posts movement 601 (GI — Delivery), reducing stock at moving average price.</p>';
    openModal('Delivery — SO '+esc(soNo), body, {wide:true, submitLabel:'Post Delivery',
      onSubmit: async ()=>{
        const lines = [];
        document.querySelectorAll('[data-delline]').forEach(inp=>{
          const q = Number(inp.value)||0;
          if(q>0) lines.push({line:Number(inp.getAttribute('data-delline')), qty:q});
        });
        if(!lines.length){ toast('Enter a delivery quantity.','warning'); return; }
        try{ showLoading('Posting delivery...');
          const r = await api('sal_postDelivery',{soNo, postingDate:document.getElementById('del_Date').value, lines});
          hideLoading(); closeModal();
          toast('Delivery '+(r.delNo||'')+' posted.','success'); renderSOTab();
        }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); }
      }});
  }
  async function renderDelTab(){
    const b = document.getElementById('salBody');

      {key:'Qty',label:'Qty',align:'right',fmt:(v,r)=>fmtQty(pick(r,'Qty','qty'))},
      {key:'Plant',label:'Plant/SLoc',fmt:(v,r)=>esc(pick(r,'Plant','plant'))+' / '+esc(pick(r,'SLoc','sloc'))}
    ], rows);
  }
};

          const r = await api('sal_postInvoice',{poNo, grNo:document.getElementById('iv_GR').value.trim(),

            currency:document.getElementById('iv_Curr').value||state.config.currency,
            docDate:document.getElementById('iv_Date').value});
          hideLoading(); closeModal();
          toast('Invoice '+(r.invNo||'')+' posted.','success'); load();
        }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); }
      }});
    document.getElementById('iv_PO').addEventListener('change', e=>{
      const p = pos.find(x=>String(pick(x,'poNo','PONo'))===e.target.value);
      if(p){ document.getElementById('iv_Vendor').value = pick(p,'vendorId','VendorID')||''; }
