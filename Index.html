        '<input type="text" id="docSearchInput" class="input" placeholder="Type document number (e.g., 4500000001, 5000000001, SO-020001, 8000000001, 5100000001, 10001)..." style="font-size:14px;padding:9px 12px;font-weight:600">' +
      '</div>' +
      '<select id="docSearchType" class="input" style="width:165px;font-size:13px">' +
        '<option value="">Auto-Detect Type</option>' +
        '<option value="PO">Purchase Order (PO)</option>' +
        '<option value="GR">Goods Receipt (GR)</option>' +
        '<option value="GI">Goods Issue (GI)</option>' +
        '<option value="SO">Sales Order (SO)</option>' +
        '<option value="DN">Delivery Note (DN)</option>' +
        '<option value="INV">Vendor Invoice (INV)</option>' +
        '<option value="PR">Purchase Requisition (PR)</option>' +
        '<option value="TR">Stock Transfer (TR)</option>' +
      '</select>' +
      '<button id="docSearchPreviewBtn" class="btn btn-primary" style="white-space:nowrap;padding:9px 16px">🔍 Preview Document</button>' +
      '<button id="docSearchPrintBtn" class="btn btn-success" style="white-space:nowrap;padding:9px 16px">🖨️ Direct Print</button>' +
    '</div>' +

    '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)">' +
      '<span style="font-weight:600;color:var(--navy)">Quick Samples:</span>' +
      '<button class="btn btn-outline small doc-sample-chip" data-no="4500000001">PO 4500000001</button>' +
      '<button class="btn btn-outline small doc-sample-chip" data-no="5000000001">GR 5000000001</button>' +
      '<button class="btn btn-outline small doc-sample-chip" data-no="SO-020001">SO-020001</button>' +
      '<button class="btn btn-outline small doc-sample-chip" data-no="8000000001">Delivery 8000000001</button>' +
      '<button class="btn btn-outline small doc-sample-chip" data-no="5100000001">Invoice 5100000001</button>' +
      '<button class="btn btn-outline small doc-sample-chip" data-no="10001">PR 10001</button>' +
    '</div>' +
  '</div>' +

  '<div id="docPreviewSection" style="display:none;margin-bottom:18px">' +
    '<div class="card" style="padding:16px 20px;border-left:4px solid var(--primary);margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
        '<div>' +
          '<span style="font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700">Document Slip Ready:</span> ' +
          '<b id="prevDocTitle" style="font-size:15px;color:var(--navy);margin-left:4px"></b>' +
        '</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="prevDirectPrintBtn" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:6px">🖨️ Print This Slip (Standard Dialog)</button>' +
          '<button id="prevCloseBtn" class="btn btn-outline small">✕ Close Preview</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div id="docPreviewContent"></div>' +
  '</div>' +

  '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">' +
      '<div>' +
        '<h3 style="margin:0 0 2px">Recent ERP Documents</h3>' +
        '<div class="muted small">Click "🖨️ Print" on any row to immediately generate that document slip</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<input type="text" id="recentFilterInput" class="input" placeholder="Filter recent documents..." style="width:200px;font-size:12px;padding:6px 10px">' +
        '<button id="recentRefreshBtn" class="btn btn-outline small" title="Refresh Recent List">🔄 Refresh</button>' +
      '</div>' +
    '</div>' +
    '<div class="tbl-wrap"><table class="tbl" id="recentDocsTable">' +
      '<thead><tr><th>Document No</th><th>Type</th><th>Posting / Created Date</th><th>Reference / Entity</th><th class="num">Value / Qty</th><th>Status</th><th style="text-align:center">Actions</th></tr></thead>' +
      '<tbody id="recentDocsTbody"><tr><td colspan="7" class="muted" style="text-align:center;padding:18px">Loading recent documents...</td></tr></tbody>' +
    '</table></div>' +
  '</div>';

  const searchInput = document.getElementById('docSearchInput');
  const typeSelect = document.getElementById('docSearchType');
  const previewBtn = document.getElementById('docSearchPreviewBtn');
  const printBtn = document.getElementById('docSearchPrintBtn');
  const heroQuickBtn = document.getElementById('docHeroQuickBtn');
  const previewSection = document.getElementById('docPreviewSection');
  const previewTitle = document.getElementById('prevDocTitle');
  const previewContent = document.getElementById('docPreviewContent');
  const directPrintBtn = document.getElementById('prevDirectPrintBtn');
  const closePreviewBtn = document.getElementById('prevCloseBtn');

  let currentPayload = null;

  async function loadAndPreview(docNo, autoPrint){
    if(!docNo) return toast('Please enter a document number.', 'warning');
    try {
      showLoading('Loading document ' + docNo + '...');
      const res = await api('doc_getDocumentForPrint', docNo);
      hideLoading();
      if(!res || !res.ok){
        toast('Document not found: ' + docNo, 'error');
        return;
      }
      currentPayload = getSlipPayload(res);
      previewTitle.textContent = currentPayload.title;
      previewContent.innerHTML = buildSlipHtml(currentPayload.title, currentPayload);
      previewSection.style.display = 'block';
      previewSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      if(autoPrint){
        openDocSlip(currentPayload.title, currentPayload);
      }
    } catch(e) {
      hideLoading();
      toast(e.message || ('Failed to load document ' + docNo), 'error');
    }
  }

  if(previewBtn){
    previewBtn.onclick = () => loadAndPreview(searchInput.value.trim(), false);
  }
  if(printBtn){
    printBtn.onclick = () => loadAndPreview(searchInput.value.trim(), true);
  }
  if(searchInput){
    searchInput.focus();
    searchInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        loadAndPreview(searchInput.value.trim(), false);
      }
    });
  }
  if(heroQuickBtn){
    heroQuickBtn.onclick = openQuickPrintModal;
  }
  if(directPrintBtn){
    directPrintBtn.onclick = ()=>{
      if(currentPayload) openDocSlip(currentPayload.title, currentPayload);
    };
  }
  if(closePreviewBtn){
    closePreviewBtn.onclick = ()=>{
      previewSection.style.display = 'none';
      currentPayload = null;
    };
  }

  // Quick sample buttons
  document.querySelectorAll('.doc-sample-chip').forEach(ch => {
    ch.onclick = ()=>{
      const no = ch.getAttribute('data-no');
      searchInput.value = no;
      loadAndPreview(no, false);
    };
  });

  // Load and render recent documents table
  let allRecentDocs = [];
  async function loadRecentDocs(){
    const tbody = document.getElementById('recentDocsTbody');
    if(!tbody) return;
    try {
      const docs = await api('doc_getRecentDocuments');
      allRecentDocs = docs || [];
      renderRecentTable();
    } catch(e) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-danger" style="text-align:center;padding:16px">Failed to load recent documents: ' + esc(e.message) + '</td></tr>';
    }
  }

  function renderRecentTable(){
    const tbody = document.getElementById('recentDocsTbody');
    const filterText = (document.getElementById('recentFilterInput')?.value || '').toLowerCase().trim();
    if(!tbody) return;

    let filtered = allRecentDocs;
    if(filterText){
      filtered = allRecentDocs.filter(d => {
        return (d.docNo || '').toLowerCase().includes(filterText) ||
               (d.docType || '').toLowerCase().includes(filterText) ||
               (d.ref || '').toLowerCase().includes(filterText);
      });
    }

    if(!filtered.length){
      tbody.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:16px">No recent documents found matching criteria.</td></tr>';
      return;
    }

    const typeBadge = (t) => {
      const colors = {
        PO: 'background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;',
        GR: 'background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;',
        GI: 'background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;',
        SO: 'background:#f5f3ff;color:#6b21a8;border:1px solid #ddd6fe;',
        DN: 'background:#faf5ff;color:#7e22ce;border:1px solid #e9d5ff;',
        INV: 'background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4;',
        PR: 'background:#fffbeb;color:#b45309;border:1px solid #fde68a;'
      };
      const style = colors[t] || 'background:#f1f5f9;color:#334155;';
      return '<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;' + style + '">' + esc(t) + '</span>';
    };

    tbody.innerHTML = filtered.map(d => {
      const valStr = typeof d.value === 'number' ? fmtMoney(d.value) : esc(d.value || '&mdash;');
      return '<tr>' +
        '<td><a href="javascript:void(0)" class="doc-row-preview" data-no="' + esc(d.docNo) + '" style="font-weight:700">' + esc(d.docNo) + '</a></td>' +
        '<td>' + typeBadge(d.docType) + '</td>' +
        '<td>' + fmtDate(d.date) + '</td>' +
        '<td>' + esc(d.ref || '&mdash;') + '</td>' +
        '<td class="num"><b>' + valStr + '</b></td>' +
        '<td>' + statusPill(d.status || 'Active') + '</td>' +
        '<td style="text-align:center">' +
          '<div style="display:inline-flex;gap:6px">' +
            '<button class="btn btn-outline small doc-row-preview" data-no="' + esc(d.docNo) + '" title="Preview slip">🔍 Preview</button>' +
            '<button class="btn btn-primary small doc-row-print" data-no="' + esc(d.docNo) + '" title="Print slip immediately">🖨️ Print</button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join('');

    tbody.querySelectorAll('.doc-row-preview').forEach(btn => {
      btn.onclick = () => {
        const no = btn.getAttribute('data-no');
        searchInput.value = no;
        loadAndPreview(no, false);
      };
    });

    tbody.querySelectorAll('.doc-row-print').forEach(btn => {
      btn.onclick = () => {
        const no = btn.getAttribute('data-no');
        searchInput.value = no;
        printDocumentByNumber(no);
      };
    });
  }

  const recentFilter = document.getElementById('recentFilterInput');
  if(recentFilter){
    recentFilter.addEventListener('input', renderRecentTable);
  }
  const refreshRecentBtn = document.getElementById('recentRefreshBtn');
  if(refreshRecentBtn){
    refreshRecentBtn.onclick = loadRecentDocs;
  }

  await loadRecentDocs();
};

/* ================================================================
   VIEW: Setup
   ================================================================ */
Views.setup = async function(c){
  const st = await api('getSetupStatus');
  state.status = st;
  if(!state.plants.length){ try{ state.plants = await api('md_listPlants'); }catch(e){} }
  const counts = st.counts||{};
  let cards = Object.keys(counts).map(k=>
    '<div class="status-card"><div class="n">'+fmtQty(counts[k])+'</div><div class="l">'+esc(k)+'</div></div>').join('');
  if(!cards) cards = '<div class="status-card"><div class="n">–</div><div class="l">No data yet</div></div>';
  c.innerHTML =
    '<div class="card"><h3>Database Status</h3><div class="status-cards">'+cards+'</div>'+
    '<p class="small muted">'+(st.initialized ? 'Database is initialized.' : 'Database is <b>not</b> initialized. Click "Initialize Database" to create all sheets and headers.')+'</p></div>'+
    '<div class="card"><h3>Company Settings</h3>'+
    '<div class="form-grid">'+
    '<div class="fld"><label>Company Name</label><input type="text" id="cfg_Company" value="'+esc(st.company||state.config.company)+'"></div>'+
    '<div class="fld"><label>Currency (ISO code)</label><input type="text" id="cfg_Curr" value="'+esc(st.currency||state.config.currency)+'" maxlength="3"></div>'+
    '</div><div class="mt"><button class="btn btn-primary" id="cfg_Save">Save Settings</button></div></div>'+
    '<div class="card"><h3>Plants &amp; Storage Locations</h3>'+
    '<div class="filter-bar" style="box-shadow:none;padding:0">'+
    '<div class="fld"><label>Plant</label><select id="sl_Plant">'+plantOptions()+'</select></div>'+
    '<button class="btn" id="sl_Load">Load SLocs</button></div>'+
    '<div id="slTbl"></div>'+
    '<div class="form-grid mt">'+
    '<div class="fld"><label>New SLoc ID</label><input type="text" id="sl_NewId" placeholder="e.g. 0002" maxlength="4"></div>'+
    '<div class="fld"><label>Description</label><input type="text" id="sl_NewDesc" placeholder="e.g. Finished Goods"></div>'+
    '</div><div class="mt"><button class="btn btn-primary" id="sl_Add">Add Storage Location</button></div></div>'+
    '<div class="card"><h3>Database Actions</h3>'+
    '<div class="toolbar">'+
    '<button class="btn btn-primary" id="db_Init">Initialize Database</button>'+
    '<button class="btn" id="db_Seed">Load Demo Data</button>'+
    '</div><p class="small muted">Demo data creates sample materials, vendors, customers, plants, purchase and sales documents.</p></div>'+
    '<div class="card"><h3>Automated Background Alerts</h3>'+
    '<p class="small muted mb">Schedules an automatic Google Apps Script background trigger to scan reorder points and email a low-stock digest every day at 08:00 AM.</p>'+
    '<div class="toolbar">'+
    '<button class="btn btn-primary" id="trig_Enable">⏰ Enable Daily Trigger (8 AM)</button>'+
    '<button class="btn" id="trig_Disable">⏹️ Disable Trigger</button>'+
    '</div><div class="small mt" id="trig_Status">Checking trigger status...</div></div>'+
    '<div class="card danger-zone"><h3>Danger Zone</h3>'+
    '<p class="small muted mb">Reset deletes <b>all</b> data in every sheet (structure is kept). This cannot be undone.</p>'+
    '<button class="btn btn-danger" id="db_Reset">Reset All Data</button></div>';
  document.getElementById('cfg_Save').onclick = async ()=>{
    const company = document.getElementById('cfg_Company').value.trim();
    const currency = document.getElementById('cfg_Curr').value.trim().toUpperCase();
    if(!company){ toast('Company name is required.','warning'); return; }
    try{ showLoading('Saving...'); await api('saveAppConfig',{company, currency}); hideLoading();
      state.config.company = company; state.config.currency = currency;
      applyConfig();
      toast('Settings saved.','success');
    }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); }
  };
  const loadSlocs = async ()=>{
    const pid = document.getElementById('sl_Plant').value;
    if(!pid){ document.getElementById('slTbl').innerHTML = '<p class="small muted">Select a plant first.</p>'; return; }
    try{
      const rows = await api('md_listSLocs', pid);
      renderTable('slTbl',[
        {key:'SLocID',label:'SLoc ID',fmt:(v,r)=>esc(pick(r,'SLocID','slocId'))},
        {key:'Description',label:'Description',fmt:(v,r)=>esc(pick(r,'Description','description'))}
      ], rows||[]);
    }catch(e){ toast('Failed: '+esc(e.message),'error'); }
  };
  document.getElementById('sl_Load').onclick = loadSlocs;
  document.getElementById('sl_Add').onclick = async ()=>{
    const pid = document.getElementById('sl_Plant').value;
    const sid = document.getElementById('sl_NewId').value.trim();
    const desc = document.getElementById('sl_NewDesc').value.trim();
    if(!pid||!sid){ toast('Plant and SLoc ID are required.','warning'); return; }
    try{ showLoading('Saving SLoc...');
      await api('md_saveSLoc', {plantId:pid, plant:pid, slocId:sid, SLocID:sid, description:desc, Description:desc});
      hideLoading();
      document.getElementById('sl_NewId').value=''; document.getElementById('sl_NewDesc').value='';
      toast('Storage location saved.','success'); loadSlocs();
    }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); }
  };
  document.getElementById('db_Init').onclick = async ()=>{
    try{ showLoading('Initializing database...'); await api('setupDatabase'); hideLoading();
      toast('Database initialized.','success'); nav('setup');
    }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); }
  };
  document.getElementById('db_Seed').onclick = async ()=>{
    if(!await confirmDlg('Load demo data? Existing records are kept; demo rows will be added.')) return;
    try{ showLoading('Loading demo data...'); await api('seedDemoData'); hideLoading();
      toast('Demo data loaded.','success'); nav('setup');
    }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); }
  };
  document.getElementById('db_Reset').onclick = async ()=>{
    if(!await confirmDlg('Reset ALL data? This deletes every record and cannot be undone.', true)) return;
    if(!await confirmDlg('Final confirmation: wipe the entire database?', true)) return;
    try{ showLoading('Resetting...'); await api('resetDatabase'); hideLoading();
      toast('Database reset.','success'); nav('setup');
    }catch(e){ hideLoading(); toast('Failed: '+esc(e.message),'error'); }
  };
  const updateTriggerUI = async ()=>{
    try {
      const res = await api('getTriggerStatus');
      const el = document.getElementById('trig_Status');
      if(el){
        el.innerHTML = res.dailyAlertScheduled ?
          '<span class="pill pill-ok">Active</span> Automated daily low-stock email alert is scheduled for 8:00 AM.' :
          '<span class="pill pill-gray">Inactive</span> No background trigger currently scheduled.';
      }
    } catch(e){}
  };
  updateTriggerUI();
  document.getElementById('trig_Enable').onclick = async ()=>{
    showLoading('Scheduling daily trigger...');
    try {
      const res = await api('setupDailyLowStockTrigger');
      toast(res.message, 'success');
      updateTriggerUI();
    } catch(e) { toast('Trigger setup error: ' + esc(e.message), 'error'); }
    finally { hideLoading(); }
  };
  document.getElementById('trig_Disable').onclick = async ()=>{
    showLoading('Removing trigger...');
    try {
      await api('removeLowStockTrigger');
      toast('Scheduled trigger removed.', 'success');
      updateTriggerUI();
    } catch(e) { toast('Error removing trigger: ' + esc(e.message), 'error'); }
    finally { hideLoading(); }
  };
};

/* ================================================================
   Config / Init
   ================================================================ */
function applyConfig(){
  document.getElementById('companyName').textContent = state.config.company||'Company';
  document.getElementById('currencyBadge').textContent = state.config.currency||'USD';
  document.getElementById('userEmail').textContent = state.config.email||'';
  document.getElementById('sidebarFoot').textContent = 'v'+(state.config.version||'1.0')+' · Apps Script Edition';
}
async function init(){
  // Topbar direct print button
  const topbarPrintBtn = document.getElementById('topbarPrintBtn');
  if(topbarPrintBtn){
    topbarPrintBtn.onclick = openQuickPrintModal;
  }

  // Keyboard shortcut Alt+P to launch print modal
  window.addEventListener('keydown', (e) => {
    if(e.altKey && (e.key === 'p' || e.key === 'P')){
      e.preventDefault();
      openQuickPrintModal();
    }
  });

  // Global quick find in topbar
  const topSearch = document.getElementById('topSearch');
  if(topSearch){
    topSearch.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        const q = topSearch.value.trim();
        if(!q) return;
        topSearch.value = '';
        topSearch.blur();

        if(q.toLowerCase().startsWith('print ')){
          const docTarget = q.replace(/^print\s+/i, '').trim();
          if(docTarget) printDocumentByNumber(docTarget);
          return;
        }

        // Direct document number search / print routing
        const isDocNo = q.startsWith('45') || q.toLowerCase().startsWith('po') ||
                        q.startsWith('50') || q.toLowerCase().startsWith('gr') ||
                        q.startsWith('49') || q.toLowerCase().startsWith('gi') ||
                        q.startsWith('80') || q.toLowerCase().startsWith('del') || q.toLowerCase().startsWith('dn') ||
                        q.startsWith('51') || q.toLowerCase().startsWith('inv') ||
                        q.toLowerCase().startsWith('pr') || q.toLowerCase().startsWith('tr');
        if(isDocNo && (q.includes('-') || q.length >= 6)){
          nav('documents');
          setTimeout(()=>{
            const inp = document.getElementById('docSearchInput');
            const previewBtn = document.getElementById('docSearchPreviewBtn');
            if(inp){ inp.value = q; }
            if(previewBtn){ previewBtn.click(); }
          }, 120);
          return;
        }

        if(q.startsWith('45') || q.toLowerCase().startsWith('po')){
          nav('purchasing');
        } else if(q.startsWith('M-') || q.toLowerCase().startsWith('mat')){
          _matSearch = q;
          nav('materials');
        } else if(q.startsWith('V-') || q.startsWith('C-')){
          nav('partners');
        } else if(q.startsWith('SO-') || q.startsWith('80')){
          nav('sales');
        } else if(q.startsWith('51') || q.toLowerCase().startsWith('inv')){
          nav('invoices');
        } else {
          _matSearch = q;
          nav('materials');
        }
      }
    });
  }

  // Mobile drawer bindings
  const toggle = document.getElementById('menuToggle');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  if(toggle && sidebar && backdrop){
    toggle.onclick = () => {
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('open');
    };
    backdrop.onclick = () => {
      sidebar.classList.remove('open');
      backdrop.classList.remove('open');
    };
    sidebar.addEventListener('click', (e) => {
      if(e.target.closest('.nav-item')){
        sidebar.classList.remove('open');
        backdrop.classList.remove('open');
      }
    });
  }

  // Environment badge indicator
  const envBadge = document.getElementById('envBadge');
  if(envBadge){
    if(hasGasBackend()){
      envBadge.className = 'badge-env live';
      envBadge.innerHTML = '<span class="status-dot online"></span> Apps Script Live';
      envBadge.title = 'Connected to Google Sheets live backend via google.script.run';
    } else {
      envBadge.className = 'badge-env preview';
      envBadge.innerHTML = '<span class="status-dot demo"></span> Standalone Preview';
      envBadge.title = 'Running in standalone simulation mode. Click for Apps Script deployment guide.';
      envBadge.onclick = () => {
        openModal('Google Apps Script Deployment',
          '<div style="line-height:1.6;font-size:13.5px">' +
          '<p class="mb"><b>You are running in Standalone Preview Mode.</b> All features work interactively with local persistence.</p>' +
          '<h3 style="color:var(--navy);margin-bottom:8px">Deploying to Google Sheets:</h3>' +
          '<ol style="padding-left:20px;display:flex;flex-direction:column;gap:6px">' +
            '<li>Create a Google Sheet and click <b>Extensions &rarr; Apps Script</b>.</li>' +
            '<li>Upload all <code>.gs</code> files and this <code>Index.html</code> into the Apps Script editor.</li>' +
            '<li>Run <code>setupDatabase()</code> or <code>seedDemoData()</code> once in the editor.</li>' +
            '<li>Click <b>Deploy &rarr; New deployment &rarr; Web app</b> and open the deployed URL!</li>' +
          '</ol></div>',
          { cancelLabel: 'Got it' }
        );
      };
    }
  }

  buildNav();
  try{
    showLoading('Connecting to ERP backend...');
    const cfg = await api('getAppConfig');
    state.config = Object.assign(state.config, cfg||{});
    applyConfig();
    const st = await api('getSetupStatus');
    state.status = st;
    hideLoading();
    nav(st && st.initialized ? 'dashboard' : 'setup');
  }catch(e){
    hideLoading();
    toast('Backend connection failed: '+esc(e.message)+'. Deploy the script as a web app and retry.', 'error');
    document.getElementById('content').innerHTML =
      '<div class="card setup-prompt"><h2>Cannot reach backend</h2>'+
      '<p>'+esc(e.message)+'</p><button class="btn btn-primary" onclick="init()">Retry</button></div>';
  }
}
window.addEventListener('load', init);
</script>
